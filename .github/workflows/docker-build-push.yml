name: Build and Push Docker Image

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  release:
    types:
      - published

jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Output SHA image tag
        id: output_sha_image_tag
        env:
          DOCKER_METADATA: ${{ steps.meta.outputs.json }}
        run: |
          # Extract the image tag containing 'sha-'
          image_tag=$(echo "$DOCKER_METADATA" | jq -r '.tags[] | select(. | test("sha-"))')
          echo "Found SHA tag: $image_tag"
          echo "sha_tag=$image_tag" >> $GITHUB_OUTPUT

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.output_sha_image_tag.outputs.sha_tag }}
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  notify-release:
    name: Notify release webhook
    # Runs once per version tag, after the image is pushed. It is a separate
    # job so a Trivy/SARIF failure in build-and-push cannot block it.
    needs: build-and-push
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions: {}

    steps:
      - name: Call release webhook
        env:
          FICUS_RELEASE_WEBHOOK_URL: ${{ secrets.FICUS_RELEASE_WEBHOOK_URL }}
          FICUS_RELEASE_WEBHOOK_TOKEN: ${{ secrets.FICUS_RELEASE_WEBHOOK_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if [ -z "$FICUS_RELEASE_WEBHOOK_URL" ] || [ -z "$FICUS_RELEASE_WEBHOOK_TOKEN" ]; then
            echo "::warning::FICUS_RELEASE_WEBHOOK_URL or FICUS_RELEASE_WEBHOOK_TOKEN is not set; skipping release webhook."
            exit 0
          fi

          payload=$(jq -nc --arg repo "$REPO" --arg tag "$TAG" \
            '{context: {event: "argus-release", repo: $repo, tag: $tag}}')

          # The token goes through a curl config on stdin so it never appears in argv.
          if ! printf 'header = "Authorization: Bearer %s"\n' "$FICUS_RELEASE_WEBHOOK_TOKEN" | \
            curl -sS --fail-with-body --max-time 30 --retry 2 \
              -X POST "$FICUS_RELEASE_WEBHOOK_URL" \
              --config - \
              -H "Content-Type: application/json" \
              -d "$payload"; then
            echo  # the response body may lack a trailing newline
            echo "::error::Release webhook call failed for $REPO@$TAG."
            exit 1
          fi

          echo
          echo "Release webhook triggered for $REPO@$TAG."
